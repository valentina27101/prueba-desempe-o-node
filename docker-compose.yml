services:
  db:
    image: postgres:15-alpine
    container_name: prueba_node
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-technical_test}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-technical_test}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: technical-test-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: